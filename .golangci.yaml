version: '2'

linters:
  default: standard
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    paths:
      - out
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/tinywaves/gohub)
      custom-order: true
  exclusions:
    generated: lax
    paths:
      - out
      - third_party$
      - builtin$
      - examples$

run:
  timeout: 5m
  tests: true
